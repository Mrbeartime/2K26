<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 672" width="1140" height="672" role="img" aria-labelledby="title desc">
<title id="title">ProjectD campaign flow</title><desc id="desc">Start, Level Select, Loading and the campaign level lead into a loop of hero actions and round resolution. Reaching an exit wins. Running out of turns or heroes loses. The result UI offers retry or navigation back to Level Select.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52667b"/></marker></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#162c40}.title,.sub,.label{text-anchor:middle}.title{font-size:17px;font-weight:650}.sub{font-size:13px;fill:#364d60}.band{font-size:12px;font-weight:700;letter-spacing:1.7px;fill:#52667b}.edge{fill:none;stroke:#52667b;stroke-width:2;stroke-linejoin:round}.label{font-size:12px;font-weight:600;paint-order:stroke;stroke:#fafbfd;stroke-width:5px;stroke-linejoin:round}.nav rect{fill:#e8f1fa;stroke:#6f97b7}.play rect{fill:#e3f2ec;stroke:#72a28f}.result rect{fill:#fbefdd;stroke:#ba9656}.nav rect,.play rect,.result rect{stroke-width:1.5}</style>
<rect width="1140" height="672" rx="16" fill="#fafbfd"/>
<text x="38" y="46" font-size="30" font-weight="680">ProjectD · Campaign flow</text>
<text class="band" x="38" y="86">SCENE NAVIGATION</text>
<path class="edge" d="M246 135 H314" marker-end="url(#arrow)"/><path class="edge" d="M528 135 H596" marker-end="url(#arrow)"/><path class="edge" d="M810 135 H878" marker-end="url(#arrow)"/>
<path class="edge" d="M988 166 V242" marker-end="url(#arrow)"/><path class="edge" d="M884 277 H810" marker-end="url(#arrow)"/><path class="edge" d="M602 277 H528" marker-end="url(#arrow)"/><path class="edge" d="M320 277 H246" marker-end="url(#arrow)"/>
<path class="edge" d="M142 246 V209 H705 V242" marker-end="url(#arrow)"/><path class="edge" d="M142 309 V387" marker-end="url(#arrow)"/><path class="edge" d="M246 422 H314" marker-end="url(#arrow)"/><path class="edge" d="M528 422 H596" marker-end="url(#arrow)"/><path class="edge" d="M810 422 H988 V313" marker-end="url(#arrow)"/>
<path class="edge" d="M424 309 V338 H556 V547 H595" marker-end="url(#arrow)"/><path class="edge" d="M705 454 V514" marker-end="url(#arrow)"/><path class="edge" d="M810 550 H878" marker-end="url(#arrow)"/>
<g class="nav"><rect x="38" y="103" width="208" height="63" rx="10"/><text class="title" x="142" y="129">Start</text><text class="sub" x="142" y="150">Guide and settings available</text></g><g class="nav"><rect x="320" y="103" width="208" height="63" rx="10"/><text class="title" x="424" y="129">Level Select</text><text class="sub" x="424" y="150">Choose an unlocked quest</text></g><g class="nav"><rect x="602" y="103" width="208" height="63" rx="10"/><text class="title" x="706" y="129">Loading</text><text class="sub" x="706" y="150">Play from Level Select</text></g><g class="nav"><rect x="884" y="103" width="208" height="63" rx="10"/><text class="title" x="988" y="129">Level 1–5</text><text class="sub" x="988" y="150">Load scene and turn rules</text></g>
<text class="band" x="38" y="193">IN-LEVEL TURN LOOP</text>
<g class="play"><rect x="884" y="246" width="208" height="63" rx="10"/><text class="title" x="988" y="272">Begin round</text><text class="sub" x="988" y="293">Reset available heroes</text></g><g class="play"><rect x="602" y="246" width="208" height="63" rx="10"/><text class="title" x="706" y="272">Choose hero</text><text class="sub" x="706" y="293">HUD or world input</text></g><g class="play"><rect x="320" y="246" width="208" height="63" rx="10"/><text class="title" x="424" y="272">Resolve action</text><text class="sub" x="424" y="293">Move, skill, interact or skip</text></g><g class="play"><rect x="38" y="246" width="208" height="63" rx="10"/><text class="title" x="142" y="272">End round?</text><text class="sub" x="142" y="293">All heroes done or End Turn</text></g>
<text class="label" x="417" y="204">No · another action or hero</text><text class="label" x="157" y="355">Yes</text>
<g class="play"><rect x="38" y="391" width="208" height="63" rx="10"/><text class="title" x="142" y="417">Resolve hazards</text><text class="sub" x="142" y="438">Projectiles → HUD → traps</text></g><g class="play"><rect x="320" y="391" width="208" height="63" rx="10"/><text class="title" x="424" y="417">Resolve enemies</text><text class="sub" x="424" y="438">Attacks → arrows → corpses</text></g><g class="play"><rect x="602" y="391" width="208" height="63" rx="10"/><text class="title" x="706" y="417">Turns left?</text><text class="sub" x="706" y="438">Decrement once per round</text></g>
<text class="label" x="892" y="417">Yes</text><text class="label" x="748" y="488">No · defeat</text><text class="label" x="555" y="367">Exit / last hero lost</text>
<g class="result"><rect x="602" y="518" width="208" height="63" rx="10"/><text class="title" x="706" y="544">Result</text><text class="sub" x="706" y="565">Victory saves completion</text></g><g class="result"><rect x="884" y="518" width="208" height="63" rx="10"/><text class="title" x="988" y="544">Next choice</text><text class="sub" x="988" y="565">Retry or return to Level Select</text></g>
<path d="M38 610 H1092" stroke="#cbd5dd"/><text x="38" y="640" font-size="14" fill="#385069">Move can leave a hero ready to act. Reading the diary returns to the same action. Game-over can interrupt resolution.</text>
</svg>
