<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 510" width="1080" height="510" role="img" aria-labelledby="title desc">
<title id="title">ProjectD script dependencies: the turn system</title><desc id="desc">PlayerController and InGameUIManager use ITurnController. TurnGameManager implements it and uses EnemyPhaseSequence, SkillTargets and LevelTurnRules. The HUD owns three presenters. TurnSession holds the scene bindings.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#516679"/></marker></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#182e40}.large{font-size:29px;font-weight:650}.subtitle{font-size:14px;fill:#425969}.node{font-size:17px;font-weight:650;text-anchor:middle}.sub{font-size:13px;text-anchor:middle;fill:#334f61}.role{font-size:12px;text-anchor:middle;fill:#495c6c;paint-order:stroke;stroke:#fbfcfc;stroke-width:5px}.e{fill:none;stroke:#516679;stroke-width:1.8;marker-end:url(#arrow)}.contract{stroke-dasharray:6 4}.view{fill:#e5f0f8;stroke:#86a5ba}.api{fill:#eeeaf6;stroke:#a69bc1}.game{fill:#e3f1e8;stroke:#86ab94}</style>
<rect width="1080" height="510" rx="14" fill="#fbfcfc"/><text x="35" y="45" class="large">ProjectD · Turn and HUD scripts</text><text x="35" y="72" class="subtitle">Arrows point from the script to the type it uses. Dashed arrows show interface implementation.</text>
