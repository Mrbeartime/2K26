<rect class="view" x="34" y="345" width="230" height="108" rx="10"/><text class="node" x="149" y="376">HUD presenters</text><text class="sub" x="149" y="402">TurnCounterText · TurnBarPresenter</text><text class="sub" x="149" y="424">HazardTimeline</text>
