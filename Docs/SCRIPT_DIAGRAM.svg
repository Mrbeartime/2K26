<path class="e" d="M910 222V343"/><text class="role" x="933" y="309">uses</text>
<rect class="view" x="34" y="110" width="230" height="64" rx="10"/><text class="node" x="149" y="137">PlayerController</text><text class="sub" x="149" y="157">World input and highlights</text>
<rect class="view" x="34" y="205" width="230" height="65" rx="10"/><text class="node" x="149" y="232">InGameUIManager</text><text class="sub" x="149" y="252">HUD input and state updates</text>
<rect class="api" x="395" y="154" width="272" height="70" rx="10"/><text class="node" x="531" y="183">ITurnController</text><text class="sub" x="531" y="204">ITurnCommands + IReadOnlyTurnState</text>
